/**
 * 快歌公共模块Maven仓库版本
 */
ext {
    modules = [
            baselibrary: [
                    groupId   : 'com.kuaige',
                    artifactId: 'baselibrary',
                    version   : '1.0.2',
                    gav       : 'com.kuaige:baselibrary:+'
            ],
            imageloader: [
                    groupId   : 'com.kuaige',
                    artifactId: 'imageloader',
                    version   : '1.0.2',
                    gav       : 'com.kuaige:imageloader:+'
            ],
            oss        : [
                    groupId   : 'com.kuaige',
                    artifactId: 'oss',
                    version   : '1.0.0',
                    gav       : 'com.kuaige:oss:+'
            ],
            payment    : [
                    groupId   : 'com.kuaige',
                    artifactId: 'payment',
                    version   : '1.0.3',
                    gav       : 'com.kuaige:payment:1.0.3'
            ],
            videoedit  : [
                    groupId   : 'com.kuaige',
                    artifactId: 'videoedit',
                    version   : '1.0.0',
                    gav       : 'com.kuaige:videoedit:+'
            ],
            luban      : [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'luban',
                    version   : '1.0.0',
                    gav       : 'com.kuaige.thirdparty:luban:+'
            ],
            matisse    : [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'matisse',
                    version   : '1.0.0',
                    gav       : 'com.kuaige.thirdparty:matisse:+'
            ],
            ucrop      : [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'ucrop',
                    version   : '1.0.1',
                    gav       : 'com.kuaige.thirdparty:ucrop:+'
            ],
            permissionx: [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'permissionx',
                    version   : '1.0.0',
                    gav       : 'com.kuaige.thirdparty:permissionx:+'
            ],
            mvchelper  : [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'mvchelper',
                    version   : '1.0.0',
                    gav       : 'com.kuaige.thirdparty:mvchelper:+'
            ],
            umeng      : [
                    groupId   : 'com.kuaige.thirdparty',
                    artifactId: 'umeng',
                    version   : '1.0.0',
                    gav       : 'com.kuaige.thirdparty:umeng:+'
            ]
    ]
}