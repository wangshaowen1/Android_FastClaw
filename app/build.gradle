void genProguardDict() {
    def file = file('proguard-dict.txt')
    if (file.exists()) {
        file.delete()
    }
    def r = new Random()
    def firstChars = ["o", "O"]
    def chars = ["o", "O", "0", "Ò", "Ó", "Ô", "Õ", "Ö"]
    int firstSize = firstChars.size()
    int size = chars.size()
    def dict = []
    for (int length = 10; length <= 30; length++) {
        for (int firstIndex = 0; firstIndex < 10; firstIndex++) {
            def word = firstChars.get(r.nextInt(firstSize))
            for (int appendLength = 1; appendLength <= length; appendLength++) {
                word += chars.get(r.nextInt(size))
            }
            dict.add(word)
        }
    }
    // 打乱顺序
    Collections.shuffle(dict, r)
    file.write(dict.join(System.lineSeparator()))
    println('genProguardDict')
}

